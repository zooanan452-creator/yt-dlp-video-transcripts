name: Download Transcripts

# 注意：GitHub Actions 的机房 IP 被 YouTube 判定为机器人。
# 实测 8 种播放器客户端（default / tv / web_safari / mweb / android_vr /
# tv_simply / ios / web_embedded）+ PO token 服务端全部返回
# "Sign in to confirm you're not a bot"，只有携带 cookies 才能通过。
#
# 因此这里只保留手动触发，不设定时任务：
#   1. 在仓库 Settings → Secrets and variables → Actions 里新增 secret
#      YOUTUBE_COOKIES，内容是浏览器导出的 cookies.txt 全文；
#   2. 到 Actions 页面手动 Run workflow。
# 没有 cookies 时，请改用仓库根目录的 run_transcripts.bat 在本机跑。

on:
  workflow_dispatch:
    inputs:
      channel_url:
        description: "YouTube 频道 / 播放列表 / 视频地址"
        required: false
        default: "https://www.youtube.com/@ltshijie"
      lang:
        description: "字幕语言优先级（逗号分隔，zh 表示中文）"
        required: false
        default: "zh"
      max_videos:
        description: "抓取最近多少个视频"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp and PO token plugin
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]" bgutil-ytdlp-pot-provider

      - name: Start PO token provider
        run: |
          docker run -d --name potprovider -p 4416:4416 --init \
            brainicism/bgutil-ytdlp-pot-provider:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO token provider is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::PO token provider 未就绪"

      - name: Download transcripts
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YTDLP_EXTRACTOR_ARGS: "youtube:fetch_pot=always"
          CHANNEL_URL: ${{ github.event.inputs.channel_url || 'https://www.youtube.com/@ltshijie' }}
          SUB_LANG: ${{ github.event.inputs.lang || 'zh' }}
          MAX_VIDEOS: ${{ github.event.inputs.max_videos || '5' }}
        run: |
          set -euo pipefail

          if [ -z "${YOUTUBE_COOKIES:-}" ]; then
            echo "::error::未配置 YOUTUBE_COOKIES secret，GitHub 机房 IP 会被 YouTube 拦截。请改用本机 run_transcripts.bat。"
            exit 1
          fi

          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          export YTDLP_COOKIEFILE="$RUNNER_TEMP/cookies.txt"

          python scripts/channel_transcripts.py "$CHANNEL_URL" \
            -o ./output \
            --lang "$SUB_LANG" \
            --max-videos "$MAX_VIDEOS" \
            --retries 5 \
            --retry-delay 5 \
            --force

      - name: Summary
        if: always()
        run: |
          echo "### 抓取结果" >> $GITHUB_STEP_SUMMARY
          if [ -f ./output/index.md ]; then
            cat ./output/index.md >> $GITHUB_STEP_SUMMARY
          else
            echo "没有生成 index.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-${{ github.event.inputs.lang || 'zh' }}
          path: ./output
          retention-days: 30
          if-no-files-found: error
