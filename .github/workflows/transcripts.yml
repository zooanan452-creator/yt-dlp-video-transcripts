name: Download Transcripts

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"  # 每天北京时间14点自动跑一次

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (upgrade yt-dlp to latest)
        run: pip install -U yt-dlp

      - name: Patch script to support cookies
        run: |
          python -c "
          import pathlib
          p = pathlib.Path('scripts/channel_transcripts.py')
          s = p.read_text()
          # Add cookiefile to all ydl_opts dicts (3 occurrences)
          s = s.replace(
              '\"quiet\": True,',
              '\"quiet\": True,\n        \"cookiefile\": \"youtube_cookies.txt\",',
          )
          p.write_text(s)
          print('Patched channel_transcripts.py with cookiefile support')
          "

      - name: Write cookies file
        if: env.YT_COOKIES != ''
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          printf '%s' "$YT_COOKIES" > youtube_cookies.txt
          echo "Cookies file written ($(wc -l < youtube_cookies.txt) lines)"

      - name: Download transcripts
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          python scripts/channel_transcripts.py \
            "https://www.youtube.com/@ltshijie" \
            -o ./output --lang zh --max-videos 5

      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: transcripts-zh
          path: ./output
          retention-days: 30
          if-no-files-found: error
